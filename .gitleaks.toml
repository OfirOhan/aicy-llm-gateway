title = "SecureLLM Gateway — Gitleaks Configuration"

[extend]
# Use the default gitleaks rule set as a base
# useDefault = true

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[A-Za-z0-9_-]{20,}'''
tags = ["api-key", "openai"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
tags = ["api-key", "anthropic"]

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["api-key", "aws"]

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws_secret_access_key\s*=\s*[A-Za-z0-9/+=]{40}'''
tags = ["api-key", "aws"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'''
tags = ["jwt"]

[[rules]]
id = "private-key"
description = "PEM Private Key"
regex = '''-----BEGIN\s+(RSA|EC|DSA|OPENSSH)?\s*PRIVATE KEY-----'''
tags = ["private-key"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key in assignment"
regex = '''(?i)(api_key|apikey|api-key|secret_key|secretkey)\s*[:=]\s*['"][A-Za-z0-9_\-]{16,}['"]'''
tags = ["api-key", "generic"]

[allowlist]
paths = [
  '''\.env\.example''',
  '''tests/.*\.test\.ts''',
  '''\.gitleaks\.toml''',
]
